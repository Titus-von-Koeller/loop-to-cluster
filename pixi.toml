[workspace]
name = "loop-to-cluster"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Python 3.14 is the newest version with full support across the training stack:
# torch ships cp314 wheels, triton has cp314 and caps itself at <3.15, numpy has
# cp314, and tokenizers/safetensors are abi3 so they are version-agnostic.
python = "3.14.*"
# Linter/formatter and test runner. From conda-forge rather than PyPI: neither links
# against the torch ABI, so the PyPI-only rule below does not apply to them.
ruff = ">=0.6"
pytest = ">=8.0"

[pypi-dependencies]
# From PyPI rather than conda-forge. conda-forge builds trail for brand-new CPython
# versions, and since 2.11 the default PyPI wheels *are* the CUDA 13 build — torch
# 2.13.0 depends on nvidia-cudnn-cu13, nvidia-nccl-cu13 and friends — which matches
# this host's driver (__cuda=13.0). No download.pytorch.org index is needed.
#
# Consequence: anything that depends on torch must also come from PyPI, not
# conda-forge. libcuda.so.1 still comes from the system driver, since no wheel can
# bundle it.
torch = ">=2.13,<3"
# torch treats numpy as optional but warns on every import without it and loses
# tensor<->ndarray interop. Taken from PyPI, not conda-forge, so that it resolves
# against the same wheels as torch rather than mixing ABIs across sources.
numpy = ">=2.5"
# The PyTorch tutorials under notebooks/ build on torchvision datasets, FashionMNIST
# among them. It is ABI-coupled to torch, so it comes from PyPI for the same reason
# and must resolve against the installed torch rather than pulling its own.
torchvision = ">=0.28, <0.29"

# The harness, installed editable so `import l2c` resolves from any working directory.
# Editable installs require a build system, which is why pyproject.toml exists; it
# carries build metadata only, and dependencies stay here where the lock file governs
# them.
l2c = { path = ".", editable = true }

# Architecture, tokenizer and dataset. Both depend on torch, so both come from PyPI
# under the rule above.
transformers = ">=5.0"
datasets = ">=5.0"

# Imported by nothing. Installed so that claims about accelerate can be checked against
# its source rather than recalled.
accelerate = ">=1.0"

# Notebooks. jupyterlab and ipykernel live in *this* environment on purpose: the kernel
# has to be the interpreter that has torch, so a separately installed Jupyter would
# execute cells against the wrong Python.
#
# jupyter-mcp-server pulls jupyter-collaboration and jupyter-mcp-tools itself. It is
# kept in the same environment as JupyterLab deliberately — it speaks the collaborative
# ydoc protocol to that server, so their versions must agree.
#
# NOTE: do NOT swap pycrdt for datalayer_pycrdt. That instruction is stale: it is frozen
# at 0.12.17 while jupyter-nbmodel-client requires pycrdt>=0.12.50, so the swap
# downgrades a dependency below what the stack needs. Datalayer's own current quick
# start installs upstream pycrdt.
jupyterlab = ">=4.4"
ipykernel = ">=6.29"
jupyter-mcp-server = ">=1.2"
# marimo notebooks are .py: the reactive graph forbids a name being bound in two cells,
# so execution order cannot diverge from the file. Same environment for the same reason
# as above -- cells run in this interpreter, which is the one that has torch.
marimo = ">=0.24, <0.25"
matplotlib = ">=3.11.1, <4"
seaborn = ">=0.13.2, <0.14"
trackio = ">=0.35.0, <0.36"

# For the interactive cells added to the tutorials under notebooks/pytorch-basics.
# None of these is imported by anything under scripts/ or l2c/.
#
# altair and plotly are the two chart libraries marimo makes reactive: a selection on
# an altair chart arrives back in Python as a dataframe, and plotly draws the 3D
# surfaces a loss landscape needs. matplotlib stays for everything static.
altair = ">=6.2, <7"
plotly = ">=7.0, <8"
# anywidget is the protocol marimo speaks to third-party widgets; wigglystuff is a
# collection built on it, and the reason it is here is TangleSlider -- a number you
# drag inside a sentence, so a paragraph about 28x28 images can be edited by hand.
anywidget = ">=0.11, <0.12"
wigglystuff = ">=0.5.30, <0.6"
# Draws an nn.Module by tracing a forward pass, so the picture shows the shapes that
# actually flow rather than the declaration order. Shells out to graphviz's `dot`,
# which is installed from nixpkgs in ~/dotfiles rather than here: it is a binary, not
# a wheel, and pixi's conda-forge build would collide with the system one on PATH.
torchview = ">=0.2.7, <0.3"
