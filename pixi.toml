[workspace]
name = "loop-to-cluster"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Python 3.14 is the newest version with full support across the training stack:
# torch ships cp314 wheels, triton has cp314 and caps itself at <3.15, numpy has
# cp314, and tokenizers/safetensors are abi3 so they are version-agnostic.
python = "3.14.*"
# Linter/formatter. From conda-forge rather than PyPI because it is a standalone
# binary with no link to the torch ABI, so the PyPI-only rule below does not apply.
ruff = ">=0.6"

[pypi-dependencies]
# From PyPI rather than conda-forge. conda-forge builds trail for brand-new CPython
# versions, and since 2.11 the default PyPI wheels *are* the CUDA 13 build — torch
# 2.13.0 depends on nvidia-cudnn-cu13, nvidia-nccl-cu13 and friends — which matches
# this host's driver (__cuda=13.0). No download.pytorch.org index is needed.
#
# Consequence: anything that depends on torch must also come from PyPI, not
# conda-forge. libcuda.so.1 still comes from the system driver, since no wheel can
# bundle it.
torch = ">=2.13,<3"
# torch treats numpy as optional but warns on every import without it and loses
# tensor<->ndarray interop. Taken from PyPI, not conda-forge, so that it resolves
# against the same wheels as torch rather than mixing ABIs across sources.
numpy = ">=2.5"

# The lab itself, installed editable so `import l2c` resolves from any working
# directory — notebooks under notebooks/ and step scripts under steps/ both need
# that. Editable installs require a build system, which is why pyproject.toml
# exists; it carries build metadata only, and dependencies stay here where the
# lock file governs them.
l2c = { path = ".", editable = true }

# Architecture and tokenizer come from transformers; the model is *constructed*
# from a config rather than loaded from a checkpoint, so no weights are fetched.
# datasets provides wikitext-2, tokenized once into .cache/.
transformers = ">=4.40"
datasets = ">=2.14"

# Not imported by any step — the lessons are deliberately bare torch. Installed so the
# accelerate cross-references throughout the docstrings can be verified against its
# source, and so a step can be diffed against the equivalent accelerate call when that
# is the clearest way to show what the call does.
accelerate = ">=1.0"

# Notebooks. jupyterlab and ipykernel live in *this* environment on purpose: the kernel
# has to be the interpreter that has torch, so a separately installed Jupyter would
# execute cells against the wrong Python.
#
# jupyter-mcp-server pulls jupyter-collaboration and jupyter-mcp-tools itself. It is
# kept in the same environment as JupyterLab deliberately — it speaks the collaborative
# ydoc protocol to that server, so their versions must agree.
#
# NOTE: do NOT swap pycrdt for datalayer_pycrdt. That instruction is stale: it is frozen
# at 0.12.17 while jupyter-nbmodel-client requires pycrdt>=0.12.50, so the swap
# downgrades a dependency below what the stack needs. Datalayer's own current quick
# start installs upstream pycrdt.
jupyterlab = ">=4.4"
ipykernel = ">=6.29"
jupyter-mcp-server = ">=1.2"
