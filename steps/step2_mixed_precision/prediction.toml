# Written BEFORE the step is run. Derivation in NOTES.md.
#
# Per-arm keys, because the point of this step is the difference between arms. The fp32
# and tf32 figures are carried over from step 1's *measurement*, not re-derived: that is
# what makes this step a delta against a baseline rather than four fresh guesses.

# --- unchanged by autocast, in every arm -------------------------------------------
# Parameters, gradients and both AdamW moments stay fp32. This is the prediction most
# people get backwards.
model_states_mib = 2052.5

# --- the autocast weight cache -----------------------------------------------------
# 211 nn.Linear weights (30 layers x 7 projections, plus the tied lm_head), holding
# 134,479,872 parameters, cast to 2 bytes = 256.5 MiB. Two bytes added to sixteen, so
# model states grow by exactly one eighth.
weight_cache_mib_bf16 = 256.5
weight_cache_mib_fp16 = 256.5
weight_cache_tensors_bf16 = 211
weight_cache_tensors_fp16 = 211

# --- activations -------------------------------------------------------------------
# fp32 and tf32 hold identical tensors; TF32 changes which kernels run, not what is
# stored. bf16 and fp16 halve most saved tensors AND drop the materialized
# B x heads x T x T attention matrix, because flash attention is dtype-gated and only
# becomes available once the tensors are 16-bit. That term is 36 of the 129 MiB per
# layer, so the block cost goes (129 - 36) / 2 = 47 MiB/layer, not 64.
activations_mib_fp32 = 4277.0
activations_mib_tf32 = 4277.0
activations_mib_bf16 = 2000.0
activations_mib_fp16 = 2000.0

# --- peak --------------------------------------------------------------------------
peak_mib_fp32 = 6620.0
peak_mib_tf32 = 6620.0
peak_mib_bf16 = 4600.0
peak_mib_fp16 = 4600.0

# --- step time ---------------------------------------------------------------------
# tf32 accelerates the projections only; attention stays on the math backend because the
# tensors are still fp32. bf16 gets both tensor-core GEMMs and flash attention.
median_step_ms_fp32 = 106.0
median_step_ms_tf32 = 75.0
median_step_ms_bf16 = 38.0
median_step_ms_fp16 = 38.0
