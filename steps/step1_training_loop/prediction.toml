# Written BEFORE the step is run. Show the working in NOTES.md.
# Omit a key (TOML has no null) and the harness just reports the measurement.

# Derived by hand from the config. Do not run the model to get this.
num_params = 134515008

# fp32 params + fp32 grads + AdamW's two fp32 moments.
bytes_per_param = 16.0

# Activations for batch_size=4, seq_len=512 — 2048 tokens. The hardest one: an
# inventory of what autograd saves per token per layer, times 30 layers, plus the
# vocabulary-sized logits and the fp32 copy the loss path makes of them.
activations_mib = 3840.0

# Peak allocated during a step. Model states plus activations, since gradients grow
# as activations are released during backward.
peak_mib = 6000.0

# Optimizer steps per second on one 4090 at fp32.
steps_per_second = 12.0
