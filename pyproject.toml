# Build metadata only.
#
# Runtime dependencies live in pixi.toml, where the lock file governs them.
# Declaring them in both places would create two competing sources of truth.
# This file exists because an editable install requires a build system:
# pixi.toml's `l2c = { path = ".", editable = true }` needs a backend to
# generate the .pth file that puts the repo root on sys.path.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "l2c"
version = "0.1.0"
description = "A lab notebook for learning distributed training, one concept at a time"
readme = "README.md"
# Pinned to the interpreter this lab actually runs on, so ruff's pyupgrade rules
# hold the code to 3.14 idiom rather than a lowest common denominator. Notably
# PEP 649 makes annotations lazy in 3.14, so `from __future__ import annotations`
# is obsolete here and ruff will flag it.
requires-python = ">=3.14"

[tool.hatch.build.targets.wheel]
packages = ["l2c"]

[tool.ruff]
# 119 is the width every repo this work targets uses -- accelerate, transformers,
# diffusers, peft, trl, bitsandbytes -- so formatting habits carry across.
line-length = 119
target-version = "py314"

[tool.ruff.lint]
# W catches trailing whitespace and a missing final newline. Neither is caught by the
# formatter on files it is told to skip, and a heredoc rewrite dropped a final newline
# once without anything noticing. W505 is the reason the two widths differ: it holds
# standalone comments and docstrings to max-doc-length while code gets the full 119,
# because prose past about 90 columns is measurably harder to read and this repo's
# docstrings are long enough for that to matter.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W"]

[tool.ruff.lint.pycodestyle]
# W505 is ignored entirely unless this is set, however it is selected above.
max-doc-length = 95

[tool.ruff.lint.per-file-ignores]
# The figures carry their titles, subtitles and footnotes as literal strings, and
# the verification scripts print aligned tables. Wrapping either splits sentences
# mid-clause for no reader's benefit.
"figures/*.py" = ["E501"]
# A marimo cell renders its last expression, so a bare trailing name is the output rather
# than dead code. Every other rule, and the formatter, still applies.
"notebooks/**/*.py" = ["B018"]
# Converted upstream tutorials. Their prose carries typographic quotes and their code
# assigns results it never reads, both on purpose; rewriting either would be editing
# someone else's material to satisfy a linter. F821 deliberately still applies -- it
# caught a conversion that renamed a reference shadowed by a function parameter, which
# would otherwise have failed at runtime.
"notebooks/pytorch-basics/*.py" = ["B018", "F841", "RUF001", "E501", "W505"]

[tool.marimo.formatting]
# Match ruff's line-length, so saving in the editor and the pre-commit hook cannot disagree.
line_length = 119

[tool.marimo.save]
format_on_save = true

[tool.marimo.runtime]
# Lazy, because a dependent cell here can hold a model on the GPU: an edit upstream
# would otherwise re-instantiate it, or re-run a training loop, as a side effect.
on_cell_change = "lazy"
auto_instantiate = false
